services:
  - type: web
    name: paytrace-ai-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paytrace-ai-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          type: static
          name: paytrace-ai-frontend
          property: host

  - type: static
    name: paytrace-ai-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: paytrace-ai-api
          property: host

databases:
  - name: paytrace-ai-db
    region: oregon
    plan: free
    databaseName: paytrace_ai
    user: paytrace_ai
